<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Navigation Menu & Plus Action Dropdown</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #070709; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .nav-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      position: relative;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .nav-btn.active {
      background: rgba(209, 254, 23, 0.12);
      color: #d1fe17;
      border: 1px solid rgba(209, 254, 23, 0.3);
    }
    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      width: 4px;
      height: 4px;
      border-radius: 9999px;
      background: #d1fe17;
      box-shadow: 0 0 6px #d1fe17;
    }
  </style>
</head>
<body class="p-8 space-y-12 bg-black">

  <div class="max-w-6xl mx-auto space-y-8">
    <div>
      <span class="text-xs font-black tracking-widest text-[#d1fe17] uppercase">Clean Streamlined Redesign</span>
      <h1 class="text-2xl font-black text-white tracking-tight mt-1">New Navigation Menu with Centered Plus (+) Creation Hub</h1>
      <p class="text-neutral-400 text-xs mt-1">No text clutter, no credit pill, platform logo on the left, and pure iconic navigation with 3-option (+) creation dropdown.</p>
    </div>

    <!-- The Redesigned Header -->
    <div id="new-nav-bar" class="w-[1280px] bg-[#09090c] border border-white/10 rounded-2xl overflow-visible shadow-2xl relative">
      <header class="h-16 px-6 bg-[#0a0a0d] flex items-center justify-between rounded-2xl">
        <!-- Left: Platform Logo Only (No "PROMPT VAULT" text) & Minimal Search -->
        <div class="flex items-center gap-5">
          <button class="w-10 h-10 rounded-xl bg-gradient-to-tr from-white/10 to-white/5 border border-white/15 flex items-center justify-center hover:border-[#d1fe17] hover:scale-105 transition-all group" title="Return Home">
            <!-- Platform Swirl Logo -->
            <svg class="w-5 h-5 text-white group-hover:text-[#d1fe17] transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.5c-2.4 0-3.8-1.4-3.8-3.3 0-1.8 1.4-3.2 3.2-3.2 2 0 3.3 1.2 3.3 2.8 0 1.5-1.1 2.5-2.5 2.5z"/>
            </svg>
          </button>

          <div class="relative w-72">
            <input
              type="text"
              placeholder="Search..."
              class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-[#d1fe17] transition-all"
            />
          </div>
        </div>

        <!-- Center: Pure Iconic Navigation + The Plus Sign (+) -->
        <nav class="flex items-center gap-1.5 bg-white/5 p-1 rounded-2xl border border-white/10 relative">
          <!-- 1. Home / Grid Icon (Active) -->
          <button class="nav-btn active" title="Home (All Drops)">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
          </button>

          <!-- 2. Mood Board Icon -->
          <button class="nav-btn text-neutral-400 hover:text-white" title="Mood Boards">
            <svg class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          </button>

          <!-- 3. THE PLUS SIGN (+) CREATION BUTTON (WITH ACTIVE DROPDOWN OPEN) -->
          <div class="relative">
            <button class="w-10 h-10 rounded-xl bg-[#d1fe17] text-black font-black flex items-center justify-center text-lg shadow-lg shadow-[#d1fe17]/25 hover:scale-105 active:scale-95 transition-all">
              +
            </button>

            <!-- Dropdown Popover Showing the 3 Options -->
            <div class="absolute top-14 left-1/2 -translate-x-1/2 w-64 bg-[#111116] border border-white/15 rounded-2xl shadow-2xl p-2 z-50 space-y-1 backdrop-blur-xl">
              <div class="px-3 py-1.5 text-[10px] font-bold text-neutral-400 uppercase tracking-wider">
                Create New
              </div>

              <!-- Option 1: AI Influencer -->
              <button class="w-full p-2.5 rounded-xl hover:bg-white/10 flex items-center gap-3 text-left transition-colors group">
                <div class="w-8 h-8 rounded-lg bg-fuchsia-500/15 text-fuchsia-400 flex items-center justify-center text-sm font-bold group-hover:scale-105 transition-transform">
                  👤
                </div>
                <div>
                  <span class="text-xs font-bold text-white block group-hover:text-[#d1fe17] transition-colors">AI Influencer</span>
                  <span class="text-[10px] text-neutral-400 block">Train persona & face lock</span>
                </div>
              </button>

              <!-- Option 2: Mood Board -->
              <button class="w-full p-2.5 rounded-xl hover:bg-white/10 flex items-center gap-3 text-left transition-colors group">
                <div class="w-8 h-8 rounded-lg bg-amber-500/15 text-amber-400 flex items-center justify-center text-sm font-bold group-hover:scale-105 transition-transform">
                  📋
                </div>
                <div>
                  <span class="text-xs font-bold text-white block group-hover:text-[#d1fe17] transition-colors">Mood Board</span>
                  <span class="text-[10px] text-neutral-400 block">Curate themed prompt drops</span>
                </div>
              </button>

              <!-- Option 3: New Project -->
              <button class="w-full p-2.5 rounded-xl hover:bg-white/10 flex items-center gap-3 text-left transition-colors group">
                <div class="w-8 h-8 rounded-lg bg-cyan-500/15 text-cyan-400 flex items-center justify-center text-sm font-bold group-hover:scale-105 transition-transform">
                  📁
                </div>
                <div>
                  <span class="text-xs font-bold text-white block group-hover:text-[#d1fe17] transition-colors">New Project</span>
                  <span class="text-[10px] text-neutral-400 block">Fresh generation canvas</span>
                </div>
              </button>
            </div>
          </div>

          <!-- 4. Video Icon -->
          <button class="nav-btn text-neutral-400 hover:text-white" title="Video Studio">
            <svg class="w-5 h-5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </button>

          <!-- 5. Assets Icon -->
          <button class="nav-btn text-neutral-400 hover:text-white" title="Assets Hub">
            <svg class="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
            </svg>
          </button>
        </nav>

        <!-- Right: Profile Avatar Only (NO CREDITS PILL) -->
        <div class="flex items-center">
          <button class="w-9 h-9 rounded-full p-0.5 bg-gradient-to-tr from-amber-500 via-rose-500 to-fuchsia-500 cursor-pointer shadow-md hover:scale-105 transition-transform">
            <img src="http://localhost:5173/images/influencer-avatar.png" class="w-full h-full rounded-full object-cover" />
          </button>
        </div>
      </header>
    </div>

  </div>

</body>
</html>
